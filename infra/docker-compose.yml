version: '3.8'

services:
  # =============================================================================
  # DATABASE
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: socialerp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialerp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-socialerp}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/init-rls.sql:/docker-entrypoint-initdb.d/init-rls.sql:ro
      - ./infra/sql/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialerp} -d ${POSTGRES_DB:-socialerp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - socialerp-network

  # =============================================================================
  # CACHE / JOB QUEUE
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: socialerp-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - socialerp-network

  # =============================================================================
  # FAKE META SERVER (WhatsApp Cloud API + Instagram Messaging API)
  # =============================================================================
  fake-meta:
    build:
      context: .
      dockerfile: packages/integrations/meta/fakes/Dockerfile
    container_name: socialerp-fake-meta
    environment:
      FAKE_META_PORT: "8080"
      FAKE_META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-test_verify_token}
      FAKE_META_APP_SECRET: ${META_APP_SECRET:-test_app_secret}
      FAKE_META_FIXTURES_DIR: /fixtures
    ports:
      - "8080:8080"
    volumes:
      - ./tests/fixtures/meta:/fixtures:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - socialerp-network

  # =============================================================================
  # FAKE DARAJA SERVER (M-Pesa STK Push)
  # =============================================================================
  fake-daraja:
    build:
      context: .
      dockerfile: packages/integrations/daraja/fakes/Dockerfile
    container_name: socialerp-fake-daraja
    environment:
      FAKE_DARAJA_PORT: "8081"
      FAKE_DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-test_consumer_key}
      FAKE_DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-test_consumer_secret}
      FAKE_DARAJA_PASSKEY: ${DARAJA_PASSKEY:-test_passkey}
      FAKE_DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-174379}
      FAKE_DARAJA_FIXTURES_DIR: /fixtures
    ports:
      - "8081:8081"
    volumes:
      - ./tests/fixtures/daraja:/fixtures:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - socialerp-network

  # =============================================================================
  # API SERVICE (FastAPI)
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: socialerp-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialerp}:${POSTGRES_PASSWORD:-socialerp_dev_password}@postgres:5432/${POSTGRES_DB:-socialerp}
      REDIS_URL: redis://redis:6379/0
      META_WEBHOOK_URL: http://fake-meta:8080
      DARAJA_BASE_URL: http://fake-daraja:8081
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-meta:
        condition: service_healthy
      fake-daraja:
        condition: service_healthy
    networks:
      - socialerp-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # =============================================================================
  # WORKER SERVICE (arq)
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: socialerp-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialerp}:${POSTGRES_PASSWORD:-socialerp_dev_password}@postgres:5432/${POSTGRES_DB:-socialerp}
      REDIS_URL: redis://redis:6379/0
      META_WEBHOOK_URL: http://fake-meta:8080
      DARAJA_BASE_URL: http://fake-daraja:8081
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-meta:
        condition: service_healthy
      fake-daraja:
        condition: service_healthy
    networks:
      - socialerp-network
    command: python -m worker.main

  # =============================================================================
  # DASHBOARD (Next.js)
  # =============================================================================
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: socialerp-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - socialerp-network
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:

networks:
  socialerp-network:
    driver: bridge