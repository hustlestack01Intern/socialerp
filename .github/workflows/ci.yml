name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  DATABASE_URL: postgresql+asyncpg://socialerp:socialerp@localhost:5432/socialerp
  REDIS_URL: redis://localhost:6379/0

jobs:
  check:
    name: Check (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialerp
          POSTGRES_PASSWORD: socialerp
          POSTGRES_DB: socialerp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socialerp -d socialerp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run linting (ruff)
        run: make lint

      - name: Run type checking (mypy)
        run: make typecheck

      - name: Run tests (pytest)
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  verify-pack:
    name: Verify Setup Pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pack verification
        run: python opencode-setup-pack-v2/scripts/verify_pack.py

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docker-compose (fake profile)
        run: docker-compose --profile fake build

      - name: Build docker-compose (app profile)
        run: docker-compose --profile app build

  # Optional: Run full make check locally equivalent
  full-check:
    name: Full Check (make check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialerp
          POSTGRES_PASSWORD: socialerp
          POSTGRES_DB: socialerp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socialerp -d socialerp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Start fake servers
        run: docker-compose --profile fake up -d

      - name: Wait for fake servers
        run: |
          sleep 5
          curl -f http://localhost:8081/health || exit 1
          curl -f http://localhost:8082/health || exit 1

      - name: Run make check
        run: make check

      - name: Cleanup
        if: always()
        run: docker-compose down --remove-orphans