name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  DATABASE_URL: postgresql+asyncpg://socialerp:socialerp@localhost:5432/socialerp
  REDIS_URL: redis://localhost:6379/0

jobs:
  check:
    name: Check (ruff + mypy + pytest + evals)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialerp
          POSTGRES_PASSWORD: socialerp
          POSTGRES_DB: socialerp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socialerp -d socialerp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The Makefile runs every Python target through `uv run`. The project is a
      # uv workspace (the `socialerp-core` member is not on PyPI), so CI must
      # install with `uv sync`, not pip (see pyproject.toml).
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      # The suite connects to the `socialerp_test` database (the postgres
      # service only creates `socialerp`). The `socialerp_app` RLS role is
      # created by the test fixtures, not here.
      - name: Create test database
        run: |
          uv run python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="localhost", user="socialerp", password="socialerp", dbname="postgres"
          )
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("SELECT 1 FROM pg_database WHERE datname = 'socialerp_test'")
              if cur.fetchone() is None:
                  cur.execute("CREATE DATABASE socialerp_test OWNER socialerp")
          conn.close()
          print("socialerp_test ready")
          PY

      # The dashboard is part of the gate: `make lint` runs eslint and
      # `make typecheck` runs tsc, so without Node/pnpm the job would fail on
      # a missing tool rather than on a real defect (found 2026-10-21).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: cd apps/dashboard && pnpm install --frozen-lockfile

      - name: Run linting (ruff + eslint)
        run: make lint

      - name: Run type checking (mypy + tsc)
        run: make typecheck

      - name: Run tests (pytest)
        run: make test

      - name: Run evaluations
        run: make eval

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  verify-pack:
    name: Verify Setup Pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pack verification
        run: python opencode-setup-pack-v2/scripts/verify_pack.py

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build fake provider images
        run: docker compose --profile fake build

      - name: Build application images
        run: docker compose --profile app build
