[project]
name = "socialerp-core"
version = "0.1.0"
description = "Core domain models, schemas, and shared logic for SocialERP"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "redis>=5.0,<6",
    "arq>=0.23,<1",
    "phonenumbers>=8.13,<9",
    "email-validator>=2.1,<3",
    "cryptography>=42.0,<43",
    "passlib[bcrypt]>=1.7,<2",
    "python-jose>=3.3,<4",
    "structlog>=24.1,<25",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "prometheus-client>=0.19,<1",
    "tenacity>=8.2,<9",
    "croniter>=2.0,<3",
    "greenlet>=3.5.6",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "fastapi>=0.143.0",
    "python-json-logger>=4.2.0",
    "psycopg2-binary>=2.9.13",
]
[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov", "pytest-mock", "hypothesis", "factory-boy", "faker"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-mock", "hypothesis", "factory-boy", "faker"]

[tool.uv.sources]
socialerp-core = { path = ".", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["socialerp*"]

