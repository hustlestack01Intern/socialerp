[project]
name = "socialerp-fake-meta"
version = "0.1.0"
description = "Fake Meta server for testing"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "python-jose>=3.3,<4",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov", "pytest-mock", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages.integrations.fake_meta*"]