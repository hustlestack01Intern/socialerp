[project]
name = "socialerp-fake-meta"
version = "0.1.0"
description = "Fake Meta (WhatsApp + Instagram) server for testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "python-jose>=3.3,<4",
    "cryptography>=42.0,<43",
    "structlog>=24.1,<25",
    "sqlite3",
]

[tool.uv]
dev-dependencies = ["ruff", "mypy", "pytest", "pytest-asyncio", "httpx"]